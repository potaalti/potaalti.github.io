# Avrupa'daki temsilcilerimiz (veri/avrupa.py): EuroLeague, EuroCup, BCL, FIBA Europe Cup verileri resmi kaynaklardan çekilir.
# Türkiye saatiyle 18:00–02:00 arası 3 dakikada bir (TBL/BSL gibi): GitHub'ın zamanlayıcısı en sık 5 dakikada bir
# çalıştırabildiği için iş yarım saatte bir başlar ve kendi içinde ~27 dakika boyunca 3 dakikada bir günceller. Diğer saatlerde
# saatte bir tek sefer. Değişiklik yoksa hiçbir şey kaydedilmez; varsa kaydedilir ve site yeniden yayınlatılır.
# (Bu kaynaklar TBF gibi GitHub sunucularını engellemiyor; telefona yük binmez.)
name: Avrupa verileri

on:
  schedule:
    - cron: '0,30 15-22 * * *'   # 18:00–01:30 başlangıçları (UTC+3), her biri yarım saat sürer: 02:00'ye kadar
    - cron: '25 0-14,23 * * *'   # gündüz ve gece: saatte bir tek sefer
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: avrupa
  cancel-in-progress: false

jobs:
  avrupa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Güncelle (akşam 3 dakikada bir, ~27 dakika)
        env:
          GH_TOKEN: ${{ github.token }}
          TEK: ${{ github.event.schedule == '25 0-14,23 * * *' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bitis=$(( $(date +%s) + 27 * 60 ))
          while :; do
            bas=$(date +%s)
            python veri/avrupa.py || echo "::warning::avrupa.py hata verdi"
            git add site/data/avrupa
            if ! git diff --cached --quiet; then
              git commit -q -m "Avrupa verileri güncellendi"
              for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
              # Bu iş kaydettiğinde "Siteyi yayınla" kendiliğinden başlamaz; elle başlatılır
              gh workflow run yayinla.yml || true
            else
              echo "Değişiklik yok"
            fi
            if [ "$TEK" = "true" ] || [ $(( $(date +%s) + 180 )) -ge "$bitis" ]; then break; fi
            bekle=$(( 180 - ($(date +%s) - bas) ))
            if [ "$bekle" -gt 0 ]; then sleep "$bekle"; fi
            git pull -q --rebase || true
          done
