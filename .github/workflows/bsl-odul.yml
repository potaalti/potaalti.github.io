# BSL haftanın ödülleri: haftanın son maçı oynandığı gece görseller kendiliğinden hazırlanır (veri/odul_yayinla.mjs otomatik bsl).
# Her gece 22:45–01:45 (Türkiye saati) saat başı bakar: son yayınlanandan sonra biten hafta varsa oyuncuları kurallarla seçer,
# görselleri site/odul/gorsel/bsl/ altına yazar, kaydeder ve siteyi yeniden yayınlatır. Biten hafta yoksa bir şey yapmaz.
# Veriler eski TBL sitesinden (telefonun güncellediği), fotoğraf ve logolar sitede kayıtlı olanlardan gelir (TBF'ye istek atılmaz).
name: BSL haftanın ödülleri

on:
  schedule:
    - cron: '45 19-22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bsl-odul
  cancel-in-progress: false

jobs:
  odul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund --prefix veri puppeteer-core@25.16.0
      - run: node veri/odul_yayinla.mjs otomatik bsl
      - name: Kaydet ve siteyi yayınlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add site/odul
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "BSL haftanın ödülleri (otomatik)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
          # Bu iş kaydettiğinde "Siteyi yayınla" kendiliğinden başlamaz; elle başlatılır
          gh workflow run yayinla.yml
