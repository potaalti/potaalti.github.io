# Site istatistikleri (veri/istatistik.mjs): GoatCounter'dan ziyaretçi sayıları yarım saatte bir çekilir, uygulamanın yönetici
# İstatistik bölümü için site/data/istatistik.json'a yazılır. GitHub sırrı GOATCOUNTER_ANAHTAR yoksa iş bir şey yapmadan biter.
name: Site istatistikleri

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: istatistik
  cancel-in-progress: false

jobs:
  istatistik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: İstatistikleri çek
        env:
          GOATCOUNTER_ANAHTAR: ${{ secrets.GOATCOUNTER_ANAHTAR }}
        run: node veri/istatistik.mjs
      - name: Kaydet ve yayınlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/istatistik.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -q -m "Site istatistikleri güncellendi"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
          # Bu iş kaydettiğinde "Siteyi yayınla" kendiliğinden başlamaz; elle başlatılır
          gh workflow run yayinla.yml || true
